<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>かけざん もんだい つくり</title>
<style>
:root{
  --pink:#ff6b9d;--pink-l:#ffe0ee;
  --blue:#5ba8ff;--blue-l:#deeeff;
  --yellow:#ffce47;--green:#47cc8a;
  --gray:#aaa;--text:#333;
  --bg:#fffdf5;--card:#fff;
}
*{box-sizing:border-box}
body{
  font-family:'Klee One','Hiragino Kaku Gothic ProN',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100dvh;margin:0;
  display:flex;flex-direction:column;
  user-select:none;-webkit-user-select:none;
}
header{
  background:var(--pink);padding:8px 14px;
  display:flex;align-items:center;gap:8px;flex-shrink:0;
  box-shadow:0 2px 6px rgba(0,0,0,.2);
}
header h1{color:#fff;font-size:1.05rem;margin:0;flex:1}

.wrap{ max-width:900px;margin:0 auto;width:100%;padding:14px 14px 60px; }

.section-label{ font-size:0.75rem;color:var(--gray);font-weight:bold;margin:14px 0 6px; }
.section-note{ font-size:0.7rem;color:#bbb;margin:-4px 0 8px; }

/* ドラッグ元のパレット */
.item-palette{ display:flex;gap:8px;flex-wrap:wrap; }
.item-src{
  width:50px;height:50px;border-radius:12px;border:2px solid #eee;background:#fff;
  font-size:1.7rem;display:flex;align-items:center;justify-content:center;
  cursor:grab;touch-action:none;box-shadow:0 2px 0 #eee;
}
.item-src:active{ cursor:grabbing; }

.tab-row{ display:flex;gap:4px;margin-top:18px; }
.tab-btn{
  padding:7px 16px;border:2px solid var(--pink-l);border-bottom:none;border-radius:12px 12px 0 0;
  background:#fdf0f5;color:var(--gray);font-family:inherit;font-size:0.82rem;font-weight:bold;cursor:pointer;
}
.tab-btn.active{ background:var(--blue-l);color:var(--blue);border-color:var(--blue-l); }
.add-row{ display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap;padding:10px;background:var(--blue-l);border-radius:0 12px 12px 12px; }
.add-btn{ background:#fff !important; }
.add-btn{
  padding:9px 16px;border:none;border-radius:12px;background:var(--blue-l);color:var(--blue);
  font-family:inherit;font-size:0.85rem;font-weight:bold;cursor:pointer;
  display:flex;align-items:center;gap:6px;
}
.add-btn:active{ transform:scale(0.96); }

.work-area{
  display:flex;flex-wrap:wrap;gap:16px;min-height:140px;
  padding:16px;background:#fff;border:2px dashed #eee;border-radius:14px;
}
.work-area.empty::before{
  content:"↑ボタンで おさら・はこ・かご・のりものを ふやしてね";
  color:#ccc;font-size:0.85rem;width:100%;text-align:center;padding:30px 0;
}

.container-card{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  position:relative;
}
.container-art{
  display:flex;align-items:center;justify-content:center;
  background-repeat:no-repeat;background-size:100% 100%;background-position:center;
  transition:transform .12s, filter .12s;
}
.container-card.plate .container-art{ width:210px;height:210px;padding:46px;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20200%20200%22%3E%3Ccircle%20cx%3D%22100%22%20cy%3D%22106%22%20r%3D%2292%22%20fill%3D%22%23000%22%20opacity%3D%22.08%22%2F%3E%3Ccircle%20cx%3D%22100%22%20cy%3D%22100%22%20r%3D%2294%22%20fill%3D%22%23fff%22%20stroke%3D%22%239cc8f2%22%20stroke-width%3D%225%22%2F%3E%3Ccircle%20cx%3D%22100%22%20cy%3D%22100%22%20r%3D%2286%22%20fill%3D%22none%22%20stroke%3D%22%23dcebfb%22%20stroke-width%3D%222.5%22%20stroke-dasharray%3D%222%207%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%22100%22%20cy%3D%22100%22%20r%3D%2278%22%20fill%3D%22%23f2f8ff%22%20stroke%3D%22%23c6defa%22%20stroke-width%3D%223%22%2F%3E%3C%2Fsvg%3E"); }
.container-card.box .container-art{ width:210px;height:189px;padding:30px 34px;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20200%20180%22%3E%3Crect%20x%3D%224%22%20y%3D%226%22%20width%3D%22192%22%20height%3D%22170%22%20rx%3D%2212%22%20fill%3D%22%23000%22%20opacity%3D%22.08%22%2F%3E%3Crect%20x%3D%224%22%20y%3D%222%22%20width%3D%22192%22%20height%3D%22170%22%20rx%3D%2212%22%20fill%3D%22%23d7a566%22%20stroke%3D%22%23b07a3c%22%20stroke-width%3D%224%22%2F%3E%3Crect%20x%3D%2218%22%20y%3D%2216%22%20width%3D%22164%22%20height%3D%22142%22%20rx%3D%226%22%20fill%3D%22%23f8e7c6%22%20stroke%3D%22%23c9985a%22%20stroke-width%3D%223%22%2F%3E%3Crect%20x%3D%2219%22%20y%3D%2217%22%20width%3D%22162%22%20height%3D%2214%22%20rx%3D%225%22%20fill%3D%22%23000%22%20opacity%3D%22.07%22%2F%3E%3Crect%20x%3D%2272%22%20y%3D%224%22%20width%3D%2256%22%20height%3D%2211%22%20rx%3D%223%22%20fill%3D%22%23fff3d6%22%20stroke%3D%22%23c9985a%22%20stroke-width%3D%221.5%22%2F%3E%3C%2Fsvg%3E"); }
.container-card.basket .container-art{ width:210px;height:220px;padding:70px 50px 46px;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20200%20210%22%3E%3Cpath%20d%3D%22M26%20112%20C%2020%20-30%2C%20180%20-30%2C%20174%20112%22%20fill%3D%22none%22%20stroke%3D%22%234f9d62%22%20stroke-width%3D%2210%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%22100%22%20cy%3D%22120%22%20r%3D%2286%22%20fill%3D%22%23000%22%20opacity%3D%22.08%22%2F%3E%3Ccircle%20cx%3D%22100%22%20cy%3D%22116%22%20r%3D%2288%22%20fill%3D%22%237cc58a%22%20stroke%3D%22%234f9d62%22%20stroke-width%3D%225%22%2F%3E%3Ccircle%20cx%3D%22100%22%20cy%3D%22116%22%20r%3D%2279%22%20fill%3D%22none%22%20stroke%3D%22%235fae72%22%20stroke-width%3D%229%22%20stroke-dasharray%3D%229%205%22%2F%3E%3Ccircle%20cx%3D%22100%22%20cy%3D%22116%22%20r%3D%2268%22%20fill%3D%22%23eaf7ec%22%20stroke%3D%22%234f9d62%22%20stroke-width%3D%223%22%2F%3E%3C%2Fsvg%3E"); }
.container-card.bus .container-art{ width:260px;height:162px;padding:18px 17px 63px;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20240%20150%22%3E%3Crect%20x%3D%226%22%20y%3D%2212%22%20width%3D%22228%22%20height%3D%22110%22%20rx%3D%2218%22%20fill%3D%22%23000%22%20opacity%3D%22.08%22%2F%3E%3Crect%20x%3D%226%22%20y%3D%228%22%20width%3D%22228%22%20height%3D%22110%22%20rx%3D%2218%22%20fill%3D%22%23ffd24a%22%20stroke%3D%22%23d9a400%22%20stroke-width%3D%224%22%2F%3E%3Crect%20x%3D%2216%22%20y%3D%2216%22%20width%3D%22208%22%20height%3D%2276%22%20rx%3D%229%22%20fill%3D%22%23eaf6ff%22%20stroke%3D%22%23b5d9ef%22%20stroke-width%3D%223%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%2298%22%20width%3D%22224%22%20height%3D%229%22%20fill%3D%22%23ff8a5c%22%2F%3E%3Ccircle%20cx%3D%22226%22%20cy%3D%22108%22%20r%3D%225%22%20fill%3D%22%23fff7b0%22%20stroke%3D%22%23d9a400%22%20stroke-width%3D%221.5%22%2F%3E%3Ccircle%20cx%3D%2262%22%20cy%3D%22122%22%20r%3D%2219%22%20fill%3D%22%234a4a4a%22%2F%3E%3Ccircle%20cx%3D%2262%22%20cy%3D%22122%22%20r%3D%228%22%20fill%3D%22%23c9c9c9%22%2F%3E%3Ccircle%20cx%3D%22178%22%20cy%3D%22122%22%20r%3D%2219%22%20fill%3D%22%234a4a4a%22%2F%3E%3Ccircle%20cx%3D%22178%22%20cy%3D%22122%22%20r%3D%228%22%20fill%3D%22%23c9c9c9%22%2F%3E%3C%2Fsvg%3E"); }
.container-card.train .container-art{ width:260px;height:162px;padding:24px 19px 62px;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20240%20150%22%3E%3Crect%20x%3D%220%22%20y%3D%22141%22%20width%3D%22240%22%20height%3D%224%22%20rx%3D%222%22%20fill%3D%22%239aa%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%223%22%20width%3D%22220%22%20height%3D%2211%22%20rx%3D%225%22%20fill%3D%22%233d8f78%22%2F%3E%3Crect%20x%3D%226%22%20y%3D%2210%22%20width%3D%22228%22%20height%3D%22112%22%20rx%3D%2214%22%20fill%3D%22%238ed8c0%22%20stroke%3D%22%234aa58c%22%20stroke-width%3D%224%22%2F%3E%3Crect%20x%3D%2218%22%20y%3D%2222%22%20width%3D%22204%22%20height%3D%2274%22%20rx%3D%229%22%20fill%3D%22%23eefaff%22%20stroke%3D%22%23b9e3d6%22%20stroke-width%3D%223%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%22101%22%20width%3D%22224%22%20height%3D%229%22%20fill%3D%22%233f9be0%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%22104%22%20width%3D%228%22%20height%3D%228%22%20rx%3D%222%22%20fill%3D%22%23666%22%2F%3E%3Crect%20x%3D%22232%22%20y%3D%22104%22%20width%3D%228%22%20height%3D%228%22%20rx%3D%222%22%20fill%3D%22%23666%22%2F%3E%3Ccircle%20cx%3D%2242%22%20cy%3D%22128%22%20r%3D%2212%22%20fill%3D%22%234a4a4a%22%2F%3E%3Ccircle%20cx%3D%2242%22%20cy%3D%22128%22%20r%3D%225%22%20fill%3D%22%23c9c9c9%22%2F%3E%3Ccircle%20cx%3D%2282%22%20cy%3D%22128%22%20r%3D%2212%22%20fill%3D%22%234a4a4a%22%2F%3E%3Ccircle%20cx%3D%2282%22%20cy%3D%22128%22%20r%3D%225%22%20fill%3D%22%23c9c9c9%22%2F%3E%3Ccircle%20cx%3D%22158%22%20cy%3D%22128%22%20r%3D%2212%22%20fill%3D%22%234a4a4a%22%2F%3E%3Ccircle%20cx%3D%22158%22%20cy%3D%22128%22%20r%3D%225%22%20fill%3D%22%23c9c9c9%22%2F%3E%3Ccircle%20cx%3D%22198%22%20cy%3D%22128%22%20r%3D%2212%22%20fill%3D%22%234a4a4a%22%2F%3E%3Ccircle%20cx%3D%22198%22%20cy%3D%22128%22%20r%3D%225%22%20fill%3D%22%23c9c9c9%22%2F%3E%3C%2Fsvg%3E"); }
.container-card.gondola .container-art{ width:190px;height:190px;padding:55px 38px 44px;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20200%20200%22%3E%3Cline%20x1%3D%22100%22%20y1%3D%220%22%20x2%3D%22100%22%20y2%3D%2234%22%20stroke%3D%22%23888%22%20stroke-width%3D%225%22%2F%3E%3Ccircle%20cx%3D%22100%22%20cy%3D%228%22%20r%3D%227%22%20fill%3D%22%23888%22%2F%3E%3Crect%20x%3D%2230%22%20y%3D%2228%22%20width%3D%22140%22%20height%3D%2226%22%20rx%3D%2213%22%20fill%3D%22%23d9566f%22%2F%3E%3Crect%20x%3D%2226%22%20y%3D%2244%22%20width%3D%22148%22%20height%3D%22132%22%20rx%3D%2218%22%20fill%3D%22%23ff8fa8%22%20stroke%3D%22%23d9566f%22%20stroke-width%3D%225%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2258%22%20width%3D%22120%22%20height%3D%2296%22%20rx%3D%2210%22%20fill%3D%22%23eefaff%22%20stroke%3D%22%23f5b3c2%22%20stroke-width%3D%223%22%2F%3E%3Crect%20x%3D%2228%22%20y%3D%22160%22%20width%3D%22144%22%20height%3D%2214%22%20rx%3D%227%22%20fill%3D%22%23d9566f%22%20opacity%3D%22.85%22%2F%3E%3C%2Fsvg%3E"); }
.container-card.drag-over .container-art{ transform:scale(1.05);filter:drop-shadow(0 0 6px var(--pink)) drop-shadow(0 0 3px var(--pink)); }

.container-label{ font-size:0.75rem;font-weight:bold;color:var(--gray); }
.del-btn{
  position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;
  border:none;background:#fff;color:#e05555;font-size:0.8rem;font-weight:bold;
  cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.15);
  display:flex;align-items:center;justify-content:center;
}

.item-display{
  display:flex;flex-wrap:wrap;gap:2px;justify-content:center;
  width:100%;height:100%;align-content:center;
}
.item-display span{ font-size:1.4rem;line-height:1;cursor:pointer; }
.item-display span:active{ transform:scale(0.8); }
.item-display .empty-hint{ font-size:0.68rem;color:#aab;text-align:center; }

.clear-all{
  margin-top:14px;display:block;margin-left:auto;margin-right:auto;
  padding:7px 18px;border:none;border-radius:10px;background:#eee;color:#888;
  font-family:inherit;font-size:0.78rem;font-weight:bold;cursor:pointer;
}

.shot-btn{
  display:block;margin:20px auto 0;padding:12px 28px;border:none;border-radius:14px;
  background:var(--green);color:#fff;font-family:inherit;font-size:0.95rem;
  font-weight:bold;cursor:pointer;box-shadow:0 3px 0 #2ea86e;
}
.shot-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 #2ea86e; }

/* ドラッグ中のゴースト */
.drag-ghost{
  position:fixed;top:0;left:0;font-size:2rem;pointer-events:none;z-index:999;
  transform:translate(-50%,-50%);filter:drop-shadow(0 3px 4px rgba(0,0,0,.25));
}

/* 文章もんだいセクション */
.sentence-box{
  background:#fff;border:2px solid var(--yellow);border-radius:14px;
  padding:16px;margin-top:6px;
}
.sentence-preview{
  font-size:1rem;line-height:2;background:#fffbe8;border-radius:10px;
  padding:14px;margin-bottom:14px;
}
.sentence-preview b{ color:var(--pink); }
.sentence-preview:empty{ min-height:6.4em; }

.answer-space{
  margin-top:12px;background:#fff;border:2px solid var(--pink-l);border-radius:10px;
  padding:14px 16px;
}
.answer-line{ display:flex;align-items:baseline;gap:8px;margin-bottom:10px; }
.answer-line:last-child{ margin-bottom:0; }
.answer-line .al-label{ font-size:0.85rem;font-weight:bold;color:var(--gray);flex-shrink:0; }
.answer-line .al-blank{
  flex:1;border-bottom:2px solid #ddd;min-height:28px;
}
.sentence-controls{ display:flex;flex-wrap:wrap;gap:12px; }
.sctrl{ display:flex;flex-direction:column;gap:3px; }
.sctrl label{ font-size:0.68rem;color:var(--gray);font-weight:bold; }
.sctrl select, .sctrl input{
  font-family:inherit;font-size:0.9rem;padding:6px 8px;border:2px solid #eee;
  border-radius:8px;color:var(--text);width:90px;
}
.sctrl select{ width:126px; } /* 「えらんでね」「🍎🍇 くだもの」が切れないように */
.num-btn{
  font-family:inherit;font-size:1.1rem;font-weight:bold;padding:6px 8px;
  border:2px solid var(--pink-l);border-radius:8px;color:var(--pink);
  width:90px;background:#fff;cursor:pointer;
}
.num-btn:active{ background:var(--pink-l); }

.num-popup{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);
  z-index:300;align-items:center;justify-content:center;padding:20px;
}
.num-popup.show{ display:flex; }
.num-popup-inner{
  background:#fff;border-radius:18px;padding:20px;max-width:320px;width:100%;
  box-shadow:0 10px 26px rgba(0,0,0,.3);
}
.num-popup-title{ font-size:0.95rem;font-weight:bold;color:var(--pink);text-align:center;margin-bottom:12px; }
.num-grid{ display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px; }
.num-grid button{
  aspect-ratio:1;border:2px solid var(--pink-l);border-radius:10px;background:#fff;
  font-family:inherit;font-size:1rem;font-weight:bold;color:var(--text);cursor:pointer;
}
.num-grid button:active{ background:var(--pink-l); }
.num-popup-close{
  display:block;margin:0 auto;padding:7px 22px;border:none;border-radius:10px;
  background:#eee;color:#888;font-family:inherit;font-size:0.8rem;font-weight:bold;cursor:pointer;
}

.hint-note{
  margin-top:22px;background:var(--yellow);color:#333;border-radius:12px;
  padding:12px 16px;font-size:0.82rem;line-height:1.7;text-align:center;
}
</style>

<body>

<header>
  <h1>🍎 かけざん もんだい つくり</h1>
</header>

<div class="wrap">

  <div class="section-label no-capture">① ものや どうぶつを ゆびで つまんで、いれものや のりものの中へ ドラッグ！</div>
  <div class="section-note no-capture">（入れたものを タップすると 1つ けせるよ）</div>
  <div class="item-palette no-capture" id="item-palette"></div>

  <div class="tab-row no-capture">
    <button class="tab-btn active" id="tab-c" onclick="setAddTab('c')">🍽️ いれもの</button>
    <button class="tab-btn" id="tab-v" onclick="setAddTab('v')">🚌 のりもの</button>
  </div>
  <div class="add-row no-capture" id="add-c">
    <button class="add-btn" onclick="addContainer('plate')">🍽️ ＋ おさら</button>
    <button class="add-btn" onclick="addContainer('box')">📦 ＋ はこ</button>
    <button class="add-btn" onclick="addContainer('basket')">🧺 ＋ かご</button>
  </div>
  <div class="add-row no-capture" id="add-v" style="display:none">
    <button class="add-btn" onclick="addContainer('bus')">🚌 ＋ バス</button>
    <button class="add-btn" onclick="addContainer('train')">🚃 ＋ でんしゃ</button>
    <button class="add-btn" onclick="addContainer('gondola')">🎡 ＋ ゴンドラ</button>
  </div>

  <div class="section-label no-capture" style="margin-top:16px">② できあがり</div>
  <div class="work-area empty" id="work-area"></div>

  <button class="clear-all no-capture" onclick="clearAll()">🗑 ぜんぶ けす</button>

  <div class="section-label no-capture" style="margin-top:26px">📝 ぶんしょう もんだいを つくる</div>
  <div class="sentence-box">
    <div class="sentence-preview" id="sentence-preview"></div>
    <div class="answer-space">
      <div class="answer-line">
        <span class="al-label">しき：</span>
        <span class="al-blank"></span>
      </div>
      <div class="answer-line">
        <span class="al-label">こたえ：</span>
        <span class="al-blank"></span>
      </div>
    </div>
    <div class="sentence-controls no-capture">
      <div class="sctrl">
        <label>いれもの</label>
        <select id="s-container" onchange="onContainerChange()">
          <option value="">えらんでね</option>
          <option value="plate">おさら</option>
          <option value="box">はこ</option>
          <option value="basket">かご</option>
          <option value="bus">バス</option>
          <option value="train">でんしゃ</option>
          <option value="gondola">ゴンドラ</option>
        </select>
      </div>
      <div class="sctrl">
        <label>なかみ</label>
        <select id="s-item" onchange="updateSentence()"></select>
      </div>
      <div class="sctrl">
        <label>1つに いくつ</label>
        <button class="num-btn" id="s-per" onclick="openNumPicker('s-per')">－</button>
      </div>
      <div class="sctrl">
        <label>いくつぶん</label>
        <button class="num-btn" id="s-groups" onclick="openNumPicker('s-groups')">－</button>
      </div>
    </div>
  </div>

  <button class="shot-btn no-capture" onclick="takeScreenshot()">📸 スクリーンショットを ほぞん</button>

  <!-- 数字えらびポップアップ -->
  <div class="num-popup no-capture" id="num-popup">
    <div class="num-popup-inner">
      <div class="num-popup-title">なんこ？</div>
      <div class="num-grid" id="num-grid"></div>
      <button class="num-popup-close" onclick="closeNumPicker()">とじる</button>
    </div>
  </div>

  <div class="hint-note no-capture">
    「📸 スクリーンショットを ほぞん」を おすと、<br>
    もんだいの がぞうが ほぞんされるよ。<br>
  </div>

</div>

<script>
const ITEMS = ['🍎','🍊','🍇','🍓','🍑','🍪','🍬','🍩','⚪','🔵','🐶','🐱','🐰','🐻','🐵'];
const WORD_MAP = {
  '🍎':'りんご','🍊':'みかん','🍇':'ぶどう','🍓':'いちご','🍑':'もも',
  '🍪':'クッキー','🍬':'あめ','🍩':'ドーナツ','⚪':'しろい おはじき','🔵':'あおい おはじき',
  '🐶':'いぬ','🐱':'ねこ','🐰':'うさぎ','🐻':'くま','🐵':'さる',
  // まぜたときの「まとめ言葉」
  '🍎🍇':'くだもの','🍪🍬':'おかし','⚪🔵':'おはじき','🐾':'どうぶつ','🎁':'もの'
};
const LABELS = { plate:'おさら', box:'はこ', basket:'かご', bus:'バス', train:'でんしゃ', gondola:'ゴンドラ' };
const ICONS = { plate:'🍽️', box:'📦', basket:'🧺', bus:'🚌', train:'🚃', gondola:'🎡' };
const COUNTERS = { plate:'まい', box:'こ', basket:'こ', bus:'だい', train:'りょう', gondola:'だい' };
const VERBS = { plate:'入っています', box:'入っています', basket:'入っています',
                bus:'のっています', train:'のっています', gondola:'のっています' };
// 何のなかまか（まぜて入れたとき、なかまの名前でまとめる）
const CATEGORY = {
  '🍎':'🍎🍇','🍊':'🍎🍇','🍇':'🍎🍇','🍓':'🍎🍇','🍑':'🍎🍇',
  '🍪':'🍪🍬','🍬':'🍪🍬','🍩':'🍪🍬',
  '⚪':'⚪🔵','🔵':'⚪🔵',
  '🐶':'🐾','🐱':'🐾','🐰':'🐾','🐻':'🐾','🐵':'🐾'
};
// 入っているものをひとことでまとめる：同じならそのまま／同じなかまならなかまの名前／ちがうなら「もの」
function summarizeItems(items) {
  if (items.every(it => it === items[0])) return items[0];
  const cats = new Set(items.map(it => CATEGORY[it] || it));
  return cats.size === 1 ? [...cats][0] : '🎁';
}
const PEOPLE = new Set(['🐶','🐱','🐰','🐻','🐵','🐾']); // どうぶつ（のりものに合うもの）
// どうぶつの数え方：1ぴき・2ひき・3びき・6ぴき・8ぴき・10ぴき…
function hikiUnit(n) {
  const d = n % 10;
  if (d === 3) return 'びき';
  if ([0, 1, 6, 8].includes(d)) return 'ぴき';
  return 'ひき';
}

let containers = []; // { id, type, items:[emoji,...] }
let nextId = 1;
let dragState = null;

// ============================================================
// パレット（ドラッグ元）
// ============================================================
function buildPalette() {
  const wrap = document.getElementById('item-palette');
  wrap.innerHTML = '';
  ITEMS.forEach(it => {
    const btn = document.createElement('div');
    btn.className = 'item-src';
    btn.textContent = it;
    btn.onpointerdown = e => startDrag(it, e);
    wrap.appendChild(btn);
  });
}

// ============================================================
// ドラッグ＆ドロップ
// ============================================================
function startDrag(item, e) {
  e.preventDefault();
  const ghost = document.createElement('div');
  ghost.className = 'drag-ghost';
  ghost.textContent = item;
  document.body.appendChild(ghost);
  dragState = { item, ghostEl: ghost };
  moveGhost(e);
  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragEnd);
}

function getXY(e) {
  if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

function moveGhost(e) {
  if (!dragState) return;
  const { x, y } = getXY(e);
  dragState.ghostEl.style.left = x + 'px';
  dragState.ghostEl.style.top = y + 'px';
  document.querySelectorAll('.container-card').forEach(c => c.classList.remove('drag-over'));
  const el = document.elementFromPoint(x, y);
  const card = el && el.closest && el.closest('.container-card');
  if (card) card.classList.add('drag-over');
}

function onDragMove(e) { e.preventDefault(); moveGhost(e); }

function onDragEnd(e) {
  if (!dragState) return;
  const { x, y } = getXY(e);
  const el = document.elementFromPoint(x, y);
  const card = el && el.closest && el.closest('.container-card');
  if (card) {
    const id = parseInt(card.dataset.id, 10);
    const c = containers.find(cc => cc.id === id);
    if (c) c.items.push(dragState.item);
  }
  document.body.removeChild(dragState.ghostEl);
  document.querySelectorAll('.container-card').forEach(c => c.classList.remove('drag-over'));
  dragState = null;
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onDragEnd);
  renderAll();
}

// ============================================================
// 容器の管理
// ============================================================
function addContainer(type) {
  containers.push({ id: nextId++, type, items: [] });
  renderAll();
}

// 文章もんだい（なにも入っていない状態）・ふやすボタンのタブを、さいしょの状態にもどす
function resetSentence() {
  document.getElementById('s-container').value = '';
  document.getElementById('s-item').value = '';
  document.getElementById('s-per').textContent = '－';
  document.getElementById('s-groups').textContent = '－';
  setAddTab('c'); // ふやすボタンも「いれもの」のタブにもどす
  closeNumPicker();
}

function removeContainer(id) {
  containers = containers.filter(c => c.id !== id);
  if (containers.length === 0) resetSentence();
  renderAll();
}

function removeItemAt(containerId, idx) {
  const c = containers.find(c => c.id === containerId);
  if (!c) return;
  c.items.splice(idx, 1);
  renderAll();
}

function clearAll() {
  containers = [];
  resetSentence();
  renderAll();
}

function renderAll() {
  const area = document.getElementById('work-area');
  area.innerHTML = '';
  area.classList.toggle('empty', containers.length === 0);

  containers.forEach(c => {
    const card = document.createElement('div');
    card.className = 'container-card ' + c.type;
    card.dataset.id = c.id;

    const del = document.createElement('button');
    del.className = 'del-btn';
    del.textContent = '✕';
    del.onclick = () => removeContainer(c.id);
    card.appendChild(del);

    const art = document.createElement('div');
    art.className = 'container-art';

    const disp = document.createElement('div');
    disp.className = 'item-display';
    if (c.items.length === 0) {
      const hint = document.createElement('div');
      hint.className = 'empty-hint';
      hint.textContent = 'ここに ドラッグ！';
      disp.appendChild(hint);
    } else {
      c.items.forEach((it, idx) => {
        const s = document.createElement('span');
        s.textContent = it;
        s.onclick = () => removeItemAt(c.id, idx);
        disp.appendChild(s);
      });
    }
    art.appendChild(disp);
    card.appendChild(art);

    const label = document.createElement('div');
    label.className = 'container-label';
    label.textContent = ICONS[c.type] + ' ' + LABELS[c.type];
    card.appendChild(label);

    area.appendChild(card);
  });

  syncSentenceFromWork(true);
}

// ============================================================
// 文章もんだい
// ============================================================
function buildItemSelect() {
  const sel = document.getElementById('s-item');
  sel.innerHTML = '<option value="">えらんでね</option>';
  ITEMS.concat(['🍎🍇','🍪🍬','⚪🔵','🐾','🎁']).forEach(it => {
    const opt = document.createElement('option');
    opt.value = it;
    opt.textContent = it + ' ' + WORD_MAP[it];
    sel.appendChild(opt);
  });
}

// ③のエリアに実際に置いた容器・中身を、文章の数字に反映する
const VEHICLES = new Set(['bus','train','gondola']);
// のりものには人、いれものにはものが合うので、中身の選択をそれに合わせる
function fitItemToType() {
  const type = document.getElementById('s-container').value;
  const itemSel = document.getElementById('s-item');
  if (!itemSel.value) return;
  const isVeh = VEHICLES.has(type);
  if (isVeh && !PEOPLE.has(itemSel.value)) itemSel.value = '🐾';
  if (!isVeh && PEOPLE.has(itemSel.value)) itemSel.value = '🍎';
}

function syncSentenceFromWork(autoSwitchType) {
  if (containers.length === 0) { fitItemToType(); updateSentence(); return; }
  const sel = document.getElementById('s-container');
  let same = containers.filter(c => c.type === sel.value);
  if (same.length === 0 && autoSwitchType) {
    sel.value = containers[containers.length - 1].type;
    same = containers.filter(c => c.type === sel.value);
  }
  if (same.length > 0) {
    document.getElementById('s-groups').textContent = same.length;
    // 置いてあるものから、なかみ（なかま分けした名前）と1つぶんの数を合わせる
    const first = same[0];
    const allItems = same.flatMap(c => c.items);
    const sameCount = first.items.length > 0 && same.every(c => c.items.length === first.items.length);
    if (allItems.length > 0) {
      document.getElementById('s-item').value = summarizeItems(allItems);
      // 1つぶんの数は、どの入れものも同じ数のときだけ合わせる
      if (sameCount) document.getElementById('s-per').textContent = first.items.length;
    } else {
      fitItemToType();
    }
  } else {
    fitItemToType();
  }
  updateSentence();
}

function setAddTab(t) {
  document.getElementById('add-c').style.display = t === 'c' ? 'flex' : 'none';
  document.getElementById('add-v').style.display = t === 'v' ? 'flex' : 'none';
  document.getElementById('tab-c').classList.toggle('active', t === 'c');
  document.getElementById('tab-v').classList.toggle('active', t === 'v');
}

function onContainerChange() {
  fitItemToType();
  syncSentenceFromWork(false);
}

function updateSentence() {
  const type = document.getElementById('s-container').value;
  const containerWord = LABELS[type];
  const verb = VERBS[type];
  const itemEmoji = document.getElementById('s-item').value;
  const itemWord = WORD_MAP[itemEmoji];
  const per = document.getElementById('s-per').textContent;
  const groups = document.getElementById('s-groups').textContent;
  // いれもの・なかみ・かずが ぜんぶ そろうまで、ぶんしょうは 何も出さない
  if (!type || !itemEmoji || !/^\d+$/.test(per) || !/^\d+$/.test(groups)) {
    document.getElementById('sentence-preview').innerHTML = '';
    return;
  }
  const counter = COUNTERS[type];
  const isPerson = PEOPLE.has(itemEmoji);
  const unit = isPerson ? hikiUnit(parseInt(per, 10) || 0) : 'こ';
  const ask = isPerson ? 'なんびき いますか' : 'なんこ ありますか';

  const html = `ひとつの<b>${containerWord}</b>に、<b>${itemWord}</b>が<b>${per}</b>${unit}ずつ ${verb}。<br>
    <b>${containerWord}</b>は<b>${groups}</b>${counter} あります。<br>
    ${itemWord}は ぜんぶで ${ask}。`;
  document.getElementById('sentence-preview').innerHTML = html;
}

// ============================================================
// 数字えらびポップアップ
// ============================================================
let numPickerTarget = null;

function openNumPicker(targetId) {
  numPickerTarget = targetId;
  const grid = document.getElementById('num-grid');
  grid.innerHTML = '';
  for (let i = 1; i <= 20; i++) {
    const btn = document.createElement('button');
    btn.textContent = i;
    btn.onclick = () => selectNum(i);
    grid.appendChild(btn);
  }
  document.getElementById('num-popup').classList.add('show');
}

function selectNum(n) {
  if (numPickerTarget) {
    document.getElementById(numPickerTarget).textContent = n;
    updateSentence();
  }
  closeNumPicker();
}

function closeNumPicker() {
  document.getElementById('num-popup').classList.remove('show');
  numPickerTarget = null;
}

// ============================================================
// 初期化
// ============================================================
// ============================================================
// スクリーンショット保存
// ============================================================
function takeScreenshot() {
  const target = document.querySelector('.wrap');
  html2canvas(target, {
    backgroundColor: '#fffdf5',
    scale: 2,
    ignoreElements: (el) => el.classList && el.classList.contains('no-capture')
  }).then(canvas => {
    const link = document.createElement('a');
    link.download = 'かけざんもんだい.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }).catch(() => {
    alert('ほぞんに しっぱいしました。もういちど ためしてね。');
  });
}

// ============================================================
// 初期化
// ============================================================
buildPalette();
buildItemSelect();
renderAll();
updateSentence();
</script>
</body>
</html>
